name: Secure RDP via Tailscale

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "⏱️ كم دقيقة تبقي RDP شغالة؟ (الافتراضي: 60)"
        required: false
        default: "60"
      username:
        description: "👤 اسم المستخدم (الافتراضي: rdpuser)"
        required: false
        default: "rdpuser"
      tailscale_auth_key:
        description: "🔐 Tailscale auth key (اختياري — سيُستخدم Secret إن وُجد)"
        required: false
        default: ""
      rdp_password:
        description: "🔑 RDP password (اختياري — سيُستخدم Secret إن وُجد)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 400

    steps:
      - name: 📋 التحقق من المدخلات
        run: |
          $duration = [int]"${{ github.event.inputs.duration_minutes }}"
          if ($duration -lt 1 -or $duration -gt 360) {
              Write-Error "❌ المدة بين 1 و 360 دقيقة"
              exit 1
          }
          Write-Host "✅ المدة: $duration دقيقة"

      - name: 🌐 تثبيت Tailscale
        run: |
          Write-Host "📦 تحميل Tailscale..."
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile "$env:TEMP\ts.msi" -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\ts.msi`"", "/quiet", "/norestart" -Wait
          Remove-Item "$env:TEMP\ts.msi" -Force
          Write-Host "✅ تم التثبيت"

      - name: 🧪 تحضير المفاتيح (Secrets أولاً، ثم المدخلات)
        run: |
          $tailscaleKey = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          if (-not $tailscaleKey -or $tailscaleKey -eq "") {
            $tailscaleKey = "${{ github.event.inputs.tailscale_auth_key }}"
          }
          $rdpPass = "${{ secrets.RDP_PASSWORD }}"
          if (-not $rdpPass -or $rdpPass -eq "") {
            $rdpPass = "${{ github.event.inputs.rdp_password }}"
          }

          if (-not $tailscaleKey -or $tailscaleKey -eq "") {
            Write-Error "❌ لم يتم توفير TAILSCALE_AUTH_KEY (لا في Secrets ولا في input)"
            exit 1
          }
          if (-not $rdpPass -or $rdpPass -eq "") {
            Write-Error "❌ لم يتم توفير RDP_PASSWORD (لا في Secrets ولا في input)"
            exit 1
          }

          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_AUTH_KEY=$tailscaleKey"
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_PASSWORD=$rdpPass"
          Write-Host "✅ المفاتيح جاهزة"

      - name: 🔗 الاتصال بـ Tailscale
        run: |
          Write-Host "🔐 الاتصال..."
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-runner-${{ github.run_number }}" `
            --accept-routes
          Start-Sleep -Seconds 10
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Write-Host "✅ IP: $tsIP"

      - name: 👤 إنشاء حساب RDP
        env:
          RDP_USERNAME: ${{ github.event.inputs.username }}
        run: |
          $username = ($env:RDP_USERNAME -replace '[^\w\.-]','').Trim()
          if (-not $username) { $username = 'rdpuser' }
          $passwordPlain = $env:RDP_PASSWORD.Trim()
          if ($passwordPlain.Length -lt 8) {
              Write-Error "❌ RDP_PASSWORD أقل من 8 أحرف"
              exit 1
          }
          $password = ConvertTo-SecureString $passwordPlain -AsPlainText -Force
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if (-not $existing) {
              New-LocalUser -Name $username -Password $password -AccountNeverExpires | Out-Null
          } else {
              Set-LocalUser -Name $username -Password $password
          }
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
          Write-Host "✅ RDP account ready"

      - name: 🔐 تفعيل RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          Restart-Service -Name TermService -Force
          Write-Host "✅ RDP جاهز"

      - name: 📍 عرض معلومات الاتصال
        run: |
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          $username = "${{ github.event.inputs.username }}"
          $duration = "${{ github.event.inputs.duration_minutes }}"
          Write-Host ""
          Write-Host "════════════════════════════════════════"
          Write-Host "📍 معلومات RDP"
          Write-Host "════════════════════════════════════════"
          Write-Host "🖥️  السيرفر: $tsIP"
          Write-Host "👤 المستخدم: $username"
          Write-Host "🔑 كلمة المرور: (موجودة في Secrets)"
          Write-Host "⏱️  المدة: $duration دقيقة"
          Write-Host "════════════════════════════════════════"

      - name: 📨 إرسال المعلومات إلى Discord
        run: |
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          $username = "${{ github.event.inputs.username }}"
          $password = $env:RDP_PASSWORD
          $duration = "${{ github.event.inputs.duration_minutes }}"
          $webhook = "https://discord.com/api/webhooks/1532742345857175673/9hFOxiJ1EMBEKnp8LbTsHXQFyaDj5T7BqQEsSH1fxNDpNE4EtqbHFtaSn3io-be6gQ2U"
          $payload = @{
            content = "🔐 **RDP via Tailscale**`n" +
                      "🖥️ السيرفر: $tsIP`n" +
                      "👤 المستخدم: $username`n" +
                      "🔑 كلمة المرور: $password`n" +
                      "⏱️ المدة: $duration دقيقة"
          } | ConvertTo-Json
          Invoke-RestMethod -Uri $webhook -Method Post -Body $payload -ContentType "application/json"
          Write-Host "✅ تم الإرسال إلى Discord"

      - name: ⏰ الانتظار
        run: |
          $duration = [int]"${{ github.event.inputs.duration_minutes }}"
          for ($i = 1; $i -le $duration; $i++) {
              $remaining = $duration - $i
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] $remaining دقيقة متبقية..."
              Start-Sleep -Seconds 60
          }
          Write-Host "✅ انتهت الجلسة"
